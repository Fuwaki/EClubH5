<!DOCTYPE html>
<html>
<head>
    <style>
        .title-gradient {
            background: linear-gradient(to bottom, #1e293b, #334155, #475569);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .subtitle-gradient {
            background: linear-gradient(to right, #0284c7, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .hover-test:hover {
            transform: scale(1.05);
            transition: transform 0.5s ease;
        }
    </style>
</head>
<body style="background: #f8fafc; padding: 50px;">
    <h1 style="font-size: 4rem; font-weight: 900; margin-bottom: 1rem;">
        <span class="title-gradient hover-test">
            LED 创意大赛
        </span>
    </h1>
    <h2 style="font-size: 2rem;">
        <span class="subtitle-gradient">
            无限创意 点亮未来
        </span>
    </h2>
</body>
</html>
